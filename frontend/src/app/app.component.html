<!--
  Layout responsivo:
  - celular e tablet (< lg): conteúdo em cima, barra de navegação embaixo (alcance do polegar);
  - desktop (lg+): menu lateral à esquerda, conteúdo à direita.
-->
<div class="relative flex h-dvh flex-col bg-gelo lg:flex-row">
  <app-toast />

  <!-- Cada página traz o próprio cabeçalho; esta área é a única que rola. -->
  <main class="flex min-h-0 flex-1 flex-col overflow-y-auto">
    @if (modoMock) {
      <div class="flex flex-wrap items-center justify-center gap-x-2 border-b border-amber-700 bg-amber-100 px-4 py-1 text-sm text-amber-950">
        <p class="flex items-center gap-1.5">
          <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
          </svg>
          <span>
            <strong>Modo demonstração</strong>
            <span class="hidden sm:inline">· dados salvos só neste navegador.</span>
          </span>
        </p>
        <!-- Área de toque de 44px mantida; a margem negativa evita engordar a faixa. -->
        <button
          type="button"
          (click)="restaurarExemplo()"
          class="-my-3 min-h-[44px] min-w-[44px] px-1 underline underline-offset-2 hover:text-amber-800"
        >
          Restaurar exemplo
        </button>
      </div>
    }
    <router-outlet />
  </main>

  <nav
    class="order-last border-t-2 border-stone-300 bg-white pb-[env(safe-area-inset-bottom)] lg:order-first lg:flex lg:w-72 lg:shrink-0 lg:flex-col lg:gap-8 lg:border-r-2 lg:border-t-0 lg:px-4 lg:py-6"
    aria-label="Navegação principal"
  >
    <!-- Marca: só no desktop; no celular cada tela já tem cabeçalho próprio. -->
    <div class="hidden items-center gap-3 px-2 lg:flex">
      <app-logo />
      <div>
        <p class="font-titulo text-2xl font-extrabold leading-tight text-tinta">Cão Saci</p>
        <p class="text-base text-stone-800">Cadeiras que devolvem o passeio</p>
      </div>
    </div>

    <ul class="grid grid-cols-3 lg:flex lg:flex-col lg:gap-2">
      @for (item of navegacao; track item.rota) {
        <li>
          <a
            [routerLink]="item.rota"
            routerLinkActive="!text-green-900 !border-green-800 bg-green-50 lg:bg-green-100 [&>span:first-child]:bg-green-200 lg:[&>span:first-child]:bg-transparent"
            ariaCurrentWhenActive="page"
            class="flex min-h-[72px] min-w-[44px] flex-col items-center justify-center gap-1 border-t-4 border-transparent px-2 py-2 font-bold text-stone-800 hover:bg-stone-100 lg:min-h-[56px] lg:flex-row lg:justify-start lg:gap-3 lg:rounded-xl lg:border-l-4 lg:border-t-0 lg:px-3"
          >
            <span class="flex h-9 w-16 items-center justify-center rounded-full lg:w-9">
              <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icone" />
              </svg>
            </span>
            <span class="text-base leading-none lg:text-lg">{{ item.rotulo }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
</div>
