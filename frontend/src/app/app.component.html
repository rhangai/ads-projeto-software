<!-- Moldura mobile-first: no celular ocupa a tela toda; no desktop vira uma coluna de celular. -->
<div class="relative mx-auto flex h-dvh max-w-md flex-col overflow-hidden bg-gelo shadow-2xl">
  <app-toast />

  <!-- Cada página traz o próprio cabeçalho; esta área é a única que rola. -->
  <main class="flex min-h-0 flex-1 flex-col overflow-y-auto">
    <router-outlet />
  </main>

  <nav
    class="border-t-2 border-stone-300 bg-white pb-[env(safe-area-inset-bottom)]"
    aria-label="Navegação principal"
  >
    <ul class="grid grid-cols-3">
      @for (item of navegacao; track item.rota) {
        <li>
          <a
            [routerLink]="item.rota"
            routerLinkActive="!text-green-900 !border-green-800 bg-green-50 [&>span:first-child]:bg-green-200"
            ariaCurrentWhenActive="page"
            class="flex min-h-[72px] min-w-[44px] flex-col items-center justify-center gap-1 border-t-4 border-transparent px-2 py-2 font-bold text-stone-800 hover:bg-stone-100"
          >
            <span class="flex h-9 w-16 items-center justify-center rounded-full">
              <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icone" />
              </svg>
            </span>
            <span class="text-base leading-none">{{ item.rotulo }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
</div>
