<!-- Região sempre presente no DOM para que leitores de tela anunciem a mudança. -->
<div class="pointer-events-none absolute inset-x-0 top-0 z-50 px-3 pt-3" aria-live="assertive" aria-atomic="true">
  @if (toast.atual(); as t) {
    <div
      [attr.role]="t.tipo === 'erro' ? 'alert' : 'status'"
      class="pointer-events-auto mx-auto flex max-w-lg items-start gap-3 rounded-2xl border-4 bg-white p-3 shadow-2xl"
      [class]="t.tipo === 'erro' ? 'border-red-800' : 'border-green-800'"
    >
      <!-- Ícone em disco sólido: lido pela forma, não só pela cor. -->
      @if (t.tipo === 'erro') {
        <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-red-800 text-white" aria-hidden="true">
          <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" />
          </svg>
        </span>
      } @else {
        <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-green-800 text-white" aria-hidden="true">
          <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
          </svg>
        </span>
      }

      <p class="flex-1 self-center text-lg leading-snug text-tinta">
        <strong class="font-bold" [class]="t.tipo === 'erro' ? 'text-red-900' : 'text-green-900'">
          {{ t.tipo === 'erro' ? 'Erro:' : 'Sucesso:' }}
        </strong>
        {{ t.mensagem }}
      </p>

      <button
        type="button"
        (click)="toast.fechar()"
        class="flex min-h-[44px] min-w-[44px] shrink-0 items-center justify-center rounded-xl border-2 border-stone-600 text-tinta hover:bg-stone-100"
        aria-label="Fechar aviso"
      >
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true">
          <path stroke-linecap="round" d="M6 6l12 12M18 6 6 18" />
        </svg>
      </button>
    </div>
  }
</div>
