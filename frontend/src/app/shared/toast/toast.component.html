<!-- Região sempre presente no DOM para que leitores de tela anunciem a mudança. -->
<div class="pointer-events-none absolute inset-x-0 top-0 z-50 px-4 pt-3" aria-live="assertive" aria-atomic="true">
  @if (toast.atual(); as t) {
    <div
      [attr.role]="t.tipo === 'erro' ? 'alert' : 'status'"
      class="pointer-events-auto flex items-start gap-3 rounded-xl border-2 p-3 shadow-lg"
      [class]="
        t.tipo === 'erro'
          ? 'border-red-700 bg-red-50 text-red-900'
          : 'border-green-700 bg-green-50 text-green-900'
      "
    >
      @if (t.tipo === 'erro') {
        <svg class="mt-0.5 h-6 w-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" />
        </svg>
      } @else {
        <svg class="mt-0.5 h-6 w-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
      }

      <p class="flex-1 py-0.5 text-base leading-snug">
        <strong class="font-bold">{{ t.tipo === 'erro' ? 'Erro:' : 'Pronto:' }}</strong>
        {{ t.mensagem }}
      </p>

      <button
        type="button"
        (click)="toast.fechar()"
        class="-m-1 flex min-h-[44px] min-w-[44px] items-center justify-center rounded-lg hover:bg-black/5"
        aria-label="Fechar aviso"
      >
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path stroke-linecap="round" d="M6 6l12 12M18 6 6 18" />
        </svg>
      </button>
    </div>
  }
</div>
